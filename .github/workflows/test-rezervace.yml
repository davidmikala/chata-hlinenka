name: Kontrola rezervacniho systemu
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Nacist projekt
        uses: actions/checkout@v4
      - name: Nastavit Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalovat zavislosti
        run: npm ci
      - name: Overit PHP syntaxi
        run: php -l public/api/rezervace.php
      - name: Sestavit web
        run: npm run build

      - name: Overit verejne soubory bez nahledoveho omezeni
        run: |
          test -f dist/.htaccess
          grep -Fq 'RewriteRule ^api/ - [L]' dist/.htaccess
          test ! -f dist/preview.php
          test ! -f dist/api/probe.php
          grep -Fq 'Allow: /' dist/robots.txt
          test -f dist/sprava-rezervaci.html
      - name: Overit realny PHP kalendar, relaci a pristup do spravy
        shell: bash
        run: |
          php -S 127.0.0.1:8765 -t dist >/tmp/hlinenka-php-test.log 2>&1 &
          for i in {1..30}; do
            if curl -sf 'http://127.0.0.1:8765/api/rezervace.php?action=health' >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS 'http://127.0.0.1:8765/api/rezervace.php?action=calendar' | jq -e '.ok == true and (.occupied | type == "array")'
          curl -fsS 'http://127.0.0.1:8765/api/rezervace.php?action=session' | jq -e '.ok == true and .admin == false'
          code=$(curl -sS -o /tmp/hlinenka-admin-response.json -w '%{http_code}' 'http://127.0.0.1:8765/api/rezervace.php?action=admin')
          test "$code" = 401
          jq -e '.ok == false' /tmp/hlinenka-admin-response.json
          curl -fsS 'http://127.0.0.1:8765/api/rezervace.php?action=ical' | grep -Fq 'BEGIN:VCALENDAR'

      - name: Zkontrolovat javascript administrace
        run: |
          python3 -c 'from pathlib import Path; s=Path("dist/sprava-rezervaci.html").read_text(); Path("/tmp/hlinenka-admin.mjs").write_text(s.split("<script>",1)[1].split("</script>",1)[0])'
          node --check /tmp/hlinenka-admin.mjs

      - name: Otestovat schvalene ceny pobytu a minimalni delku
        shell: bash
        run: |
          set -euo pipefail
          base='http://127.0.0.1:8765/api/rezervace.php'
          curl -fsS "$base?action=calendar" | jq -e '.pricing.offShort == 20000 and .pricing.offWeek == 28000 and .pricing.extraNight == 5000 and .pricing.summerShort == 28000 and .pricing.summerWeek == 35000'
          check_price() {
            local start="$1" end="$2" price="$3" min="$4"
            curl -fsS "$base?action=quote&start=$start&end=$end" |
              jq -e --argjson expected "$price" --argjson minimum "$min" \
                '.ok == true and .total == $expected and .min == $minimum'
          }
          check_price 2027-04-09 2027-04-11 20000 2
          check_price 2027-04-09 2027-04-12 20000 2
          check_price 2027-04-09 2027-04-13 25000 2
          check_price 2027-04-09 2027-04-14 28000 2
          check_price 2027-04-09 2027-04-16 28000 2
          check_price 2027-04-09 2027-04-10 null 2
          check_price 2027-07-03 2027-07-07 28000 4
          check_price 2027-07-03 2027-07-08 35000 4
          check_price 2027-07-03 2027-07-09 35000 4
          check_price 2027-07-03 2027-07-10 35000 4
          check_price 2027-07-03 2027-07-06 null 4
          check_price 2027-12-24 2027-12-27 null 2
          check_price 2027-06-30 2027-07-07 null 4


      - name: Ověřit nový turistický podklad a e-mailová upozornění v kódu
        shell: bash
        run: |
          grep -Fq 'frame.mapy.cz/turisticka?x=17.6217614' src/components/ContactMap.jsx
          grep -Fq 'mapset=outdoor' src/components/ContactMap.jsx
          grep -Fq "OWNER_MAIL = 'david@mikala.cz'" public/api/rezervace.php
          grep -Fq 'retry-inquiry-notice' public/api/rezervace.php
          grep -Fq "smtp-config.php" public/api/rezervace.php
      - name: Ověřit stav veřejného mapového rámce Mapy.com
        continue-on-error: true
        shell: bash
        run: |
          url='https://frame.mapy.cz/turisticka?x=17.6217614&y=49.3711206&z=15'
          code=$(curl -L -sS --connect-timeout 15 --max-time 25 -D /tmp/maphdr -o /tmp/mapbody -w '%{http_code}' "$url" || echo "000")
          echo "::notice title=Mapy.com embed::HTTP status: ${code}"
          test "$code" = 200


      - name: Otestovat fakturacni cyklus a lokalni QR platbu
        shell: bash
        run: bash scripts/test-invoices.sh
